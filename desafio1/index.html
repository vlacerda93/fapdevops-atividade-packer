<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Servidor Apache em imagem Docker construída de forma imutável com HashiCorp Packer.">
  <title>Servidor Apache - Packer &amp; Docker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Plus+Jakarta+Sans:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0E141B; --card: #151F2A; --text: #E6EDF3; --muted: #94A3B8;
      --gold: #C5A059; --silver: #8C9BAE; --green: #1B4332; --green-l: #2D6A4F;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center;
      background: radial-gradient(ellipse at top, #18222D 0%, var(--bg) 70%);
      color: var(--text); font-family: 'Plus Jakarta Sans', Inter, sans-serif; padding: 24px;
    }
    .card {
      max-width: 560px; width: 100%; background: var(--card); border: 1px solid var(--gold);
      border-radius: 8px; padding: 44px 40px; text-align: center;
      box-shadow: 0 18px 40px rgba(0, 0, 0, .35);
      animation: rise .7s ease-out both;
    }
    .rule { height: 1px; margin: 20px auto; width: 60%; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
    h1 { font-family: 'Cinzel', serif; color: var(--gold); font-size: 1.7rem; margin: 0; letter-spacing: .5px; }
    p { color: var(--muted); line-height: 1.6; margin: 0 0 8px; }
    .badge {
      display: inline-block; margin-top: 18px; padding: 6px 14px; border-radius: 4px;
      background: var(--green); border: 1px solid var(--green-l); font-weight: 600;
      transition: transform .2s ease, border-color .2s ease;
    }
    .badge:hover { transform: translateY(-2px); border-color: var(--gold); }
    code {
      display: block; margin-top: 22px; padding: 10px; border-radius: 4px; border: 1px solid #23303D;
      background: var(--bg); color: var(--silver); font-family: 'JetBrains Mono', monospace; font-size: .85rem;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <main class="card">
    <h1>Imagem Construída com HashiCorp Packer!</h1>
    <div class="rule"></div>
    <p>Servidor Apache provisionado e customizado de forma imutável.</p>
    <p>Este arquivo foi injetado na imagem pelo provisioner <strong>file</strong>.</p>
    <span class="badge" id="badge-desafio1">Desafio 1: meu-apache-packer</span>
    <code>docker run -d -p 8081:80 meu-apache-packer:latest</code>
  </main>
</body>
</html>
